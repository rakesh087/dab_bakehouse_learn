# This is a Databricks asset bundle definition for dab_bakehouse.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_bakehouse
  uuid: d45010f7-5187-47ce-b278-ed9f0f678c09

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-5a129a87-cecb.cloud.databricks.com
    variables:
      catalog: dab_bakehouse_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-5a129a87-cecb.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/happyending2012to16@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/happyending2012to16@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dab_bakehouse
      schema: prod
    permissions:
      - user_name: happyending2012to16@gmail.com
        level: CAN_MANAGE
